<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Sudoku Extractor</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        background: #f7f9fa;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 2px;
        width: 360px;
        margin: 20px auto;
        background: #333;
        border: 3px solid #333;
      }
      .cell {
        width: 38px;
        height: 38px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
      }
      canvas {
        max-width: 100%;
        height: auto;
        margin-top: 10px;
        border: 1px solid #ccc;
      }
      .status {
        margin: 10px;
        font-weight: bold;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Sudoku Digit Extractor</h2>
      <div id="status" class="status">Loading OpenCV.js...</div>
      <input type="file" id="fileInput" accept="image/*" disabled />
      <br /><br />
      <canvas id="canvasInput"></canvas>

      <h3>Extracted Grid Data</h3>
      <div id="sudokuGrid" class="grid"></div>
    </div>

    <!--async-->
    <!--onload="onOpenCvReady()"-->
    <script src="opencv.js" type="text/javascript"></script>

    <script type="module">
      import {
        pipeline,
        RawImage,
      } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js";
      let model;
      let ocr;

      const status = document.getElementById("status");
      const fileInput = document.getElementById("fileInput");

      status.innerText = "OpenCV.js Loaded. Loading TF.js model...";
      await initTransformerJS();

      async function initTransformerJS() {
        try {
          ocr = await pipeline(
            "image-to-text",
            "Xenova/trocr-small-handwritten",
            { device: "webgpu" }, // Use 'webgpu' for acceleration or omit for default WASM fallback
          );
          status.innerText = "Ready. Upload an image.";
          fileInput.disabled = false;
        } catch (e) {
          status.innerText = "Error initializing model: " + e.message;
        }
      }

      fileInput.addEventListener("change", async (e) => {
        let imgElement = new Image();
        imgElement.src = URL.createObjectURL(e.target.files[0]);
        imgElement.onload = async () => {
          let src = cv.imread(imgElement);
          cv.imshow("canvasInput", src);
          await processSudokuGrid(src);
          src.delete();
          console.log("deleted src");
        };
      });

      async function processSudokuGrid(src) {
        status.innerText = "Processing image grid...";

        // 1. Grayscale and Blur
        let gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
        let blurred = new cv.Mat();
        // Reduce high frequency noise
        cv.GaussianBlur(
          gray,
          blurred,
          new cv.Size(11, 11),
          0,
          0,
          cv.BORDER_DEFAULT,
        );

        // 2. Adaptive Thresholding
        let thresh = new cv.Mat();
        cv.adaptiveThreshold(
          blurred,
          thresh,
          255,
          cv.ADAPTIVE_THRESH_GAUSSIAN_C,
          cv.THRESH_BINARY_INV,
          11,
          2,
        );

        // 3. Find Contours to locate the Sudoku grid
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();
        // RETR_EXTERNAL extracts only the outermost contours, ignoring cells inside
        cv.findContours(
          thresh,
          contours,
          hierarchy,
          cv.RETR_EXTERNAL,
          cv.CHAIN_APPROX_SIMPLE,
        );

        let maxArea = 0;
        let maxIndex = -1;
        for (let i = 0; i < contours.size(); ++i) {
          let area = cv.contourArea(contours.get(i));
          if (area > maxArea) {
            maxArea = area;
            maxIndex = i;
          }
        }

        if (maxIndex === -1) {
          status.innerText = "Could not find Sudoku grid contour.";
          cleanup([gray, blurred, thresh, contours, hierarchy]);
          return;
        }

        // 4. Perspective Warp to get a flat 252x252 grid
        let gridContour = contours.get(maxIndex);
        let perimeter = cv.arcLength(gridContour, true);
        let approx = new cv.Mat();
        cv.approxPolyDP(gridContour, approx, 0.02 * perimeter, true);
        console.log("approx", approx.rows);

        if (approx.rows !== 4) {
          let tempCanvas = document.createElement("canvas");
          tempCanvas.width = src.width;
          tempCanvas.height = src.height;
          cv.imshow(tempCanvas, thresh);
          document.body.appendChild(tempCanvas);

          status.innerText = "Grid shape is irregular (needs 4 corners).";
          cleanup([gray, blurred, thresh, contours, hierarchy, approx]);
          return;
        }

        let warped = new cv.Mat();
        let dsize = new cv.Size(252, 252); // 9 cells * 28px = 252

        // Sort corner coordinates ordered: top-left, top-right, bottom-right, bottom-left
        let points = [];
        for (let i = 0; i < 4; i++) {
          points.push({
            x: approx.data32S[i * 2],
            y: approx.data32S[i * 2 + 1],
          });
        }
        points.sort((a, b) => a.y - b.y);
        let top = points.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottom = points.slice(2, 4).sort((a, b) => a.x - b.x);

        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          top[0].x,
          top[0].y,
          top[1].x,
          top[1].y,
          bottom[1].x,
          bottom[1].y,
          bottom[0].x,
          bottom[0].y,
        ]);
        let dstTri = cv.matFromArray(
          4,
          1,
          cv.CV_32FC2,
          [0, 0, 252, 0, 252, 252, 0, 252],
        );
        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(thresh, warped, M, dsize);

        // 5. Segment and Recognize Cells
        await segmentAndPredict(warped);

        // Cleanup Mats
        cleanup([
          gray,
          blurred,
          thresh,
          contours,
          hierarchy,
          approx,
          warped,
          srcTri,
          dstTri,
          M,
        ]);
      }

      async function segmentAndPredict(warpedGrid) {
        const cellSize = 28;
        const gridDiv = document.getElementById("sudokuGrid");
        gridDiv.innerHTML = "";

        status.innerText = "Extracting and recognizing cells...";

        // Loop through 9x9 matrix
        for (let row = 0; row < 9; row++) {
          for (let col = 0; col < 9; col++) {
            let rect = new cv.Rect(
              col * cellSize,
              row * cellSize,
              cellSize,
              cellSize,
            );
            let cellMat = warpedGrid.roi(rect);

            // Check pixel density to filter out empty cells safely
            let whitePixels = cv.countNonZero(cellMat);
            let totalPixels = cellSize * cellSize;

            let prediction = 0;

            // If cell has structural contents (e.g. over 6% pixel fill), run it through the model
            if (whitePixels / totalPixels > 0.06) {
              prediction = await runInference(cellMat);
            }

            let cellEl = document.createElement("div");
            cellEl.className = "cell";
            cellEl.innerText = prediction === 0 ? "" : prediction;
            gridDiv.appendChild(cellEl);

            cellMat.delete();
            console.log("deleted cel mat");
          }
        }
        status.innerText = "Extraction complete.";
      }

      async function runInference(cellMat) {
        // Canvas conversion for TF.js ingestion
        let tempCanvas = document.createElement("canvas");
        tempCanvas.width = 28;
        tempCanvas.height = 28;

        let inverted = new cv.Mat();
        cv.bitwise_not(cellMat, inverted);

        let padded = new cv.Mat();
        let denoised = new cv.Mat();
        let dst = new cv.Mat();

        // Step 2: Add a temporary border (Reflect mode works best for denoising)
        // The border size should match or exceed the search window template size (usually 7-21 pixels)
        let borderSize = 30;
        cv.copyMakeBorder(
          inverted,
          padded,
          borderSize,
          borderSize,
          borderSize,
          borderSize,
          cv.BORDER_REFLECT_101,
        );

        cv.medianBlur(padded, denoised, 3);

        // Step 4: Crop the image back to its original size to remove the border
        let rect = new cv.Rect(
          borderSize,
          borderSize,
          inverted.cols,
          inverted.rows,
        );
        dst = denoised.roi(rect);

        cv.imshow(tempCanvas, dst);
        document.body.appendChild(tempCanvas);

        const image = RawImage.fromCanvas(tempCanvas);
        const output = await ocr(image);
        console.log("running inference", output);
        return output[0].generated_text;
        cleanup([inverted, padded, denoised, dst]);
      }

      function cleanup(matArray) {
        matArray.forEach((mat) => {
          if (mat) mat.delete();
          console.log("delted mat");
        });
      }
    </script>
  </body>
</html>
