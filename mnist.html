<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transformers.js MNIST Recognition</title>
  </head>
  <body>
    <h1>MNIST Digit Recognition</h1>

    <!-- Canvas or Image to provide the digit -->
    <img
      id="digit-image"
      src="six.png"
      width="140"
      height="140"
      alt="Digit to recognize"
    />

    <p id="status">Loading Vision Transformer model...</p>

    <!-- Import Transformers.js -->
    <script type="module">
      import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js";

      async function run() {
        const statusText = document.getElementById("status");
        const imgElement = document.getElementById("digit-image");

        try {
          // Load the image-to-text pipeline with a specialized handwritten text model
          const ocr = await pipeline(
            "image-to-text",
            "Xenova/trocr-small-handwritten",
            { device: "webgpu" }, // Use 'webgpu' for acceleration or omit for default WASM fallback
          );

          statusText.innerText = "Analyzing image...";

          // 2. Classify the HTML image element directly
          const output = await ocr(imgElement.src);
          console.log(`Detected Digits: ${output[0].generated_text}`);

          // 3. Output the top prediction
          const topPrediction = output[0];
          statusText.innerHTML = `<strong>Predicted Digit:</strong> ${topPrediction.generated_text}`;
          console.log("Full output:", output);
        } catch (error) {
          statusText.innerText = "Error running model: " + error.message;
          console.error(error);
        }
      }

      run();
    </script>
  </body>
</html>
